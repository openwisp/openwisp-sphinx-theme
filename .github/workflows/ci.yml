name: OpenWISP Sphinx Theme CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install the theme and Sphinx
        run: python -m pip install . sphinx

      - name: Build the demo documentation
        run: python -m sphinx -W --keep-going -b html doc build/html
